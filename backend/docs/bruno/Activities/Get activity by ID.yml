docs: |-
  Returns the full data of an activity, including details and address if available.

  **Authentication:** `optionalAuth`. Today the router uses `auth()` without
  options, which decodes the cookie when present and never answers 401. When the
  request carries a valid session, the response also includes `enrollmentStatus`,
  the requester's enrollment in this activity:

  | Request | `enrollmentStatus` |
  |---|---|
  | no token | absent |
  | malformed, expired or invalid token | absent (the request is treated as anonymous) |
  | valid token, user never enrolled | `null` |
  | valid token, with an enrollment | the enrollment `status`: `PENDING`, `APPROVED`, `REJECTED` or `CANCELLED` |

  Absent and `null` are different states: absent means the server recognized
  no session; `null` means authenticated with no enrollment.

  - The user is resolved exclusively from the JWT token (never from params, query or body).
  - Invalid tokens are treated as anonymous for now. Once the route moves to
    `optionalAuth()`, a present but invalid or expired token will answer 401
    (see `docs/api-conventions.md`, section 5).

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
