info:
  name: Get activity by ID
  type: http
  seq: 3
  tags:
    - Activities

http:
  method: GET
  url: "{{baseUrl}}/activities/:id"
  params:
    - name: id
      value: f26559ac-d672-4252-a9a4-d6fe6583d8ec
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

