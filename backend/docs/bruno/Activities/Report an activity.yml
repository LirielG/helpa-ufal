info:
  name: Report an activity
  type: http
  seq: 6
  tags:
    - Activities

http:
  method: POST
  url: "{{baseUrl}}/activities/:id/reports"
  params:
    - name: id
      value: 22ac40bd-e160-4c6e-8505-b63913d2482f
      type: path
      description: Activity UUID
  body:
    type: json
    data: |-
      {
        "category": "MISINFORMATION",
        "description": "The address provided is incorrect."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
