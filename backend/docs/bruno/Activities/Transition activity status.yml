info:
  name: Transition activity status
  type: http
  seq: 5
  tags:
    - Activities

http:
  method: PATCH
  url: "{{baseUrl}}/activities/:id/status"
  params:
    - name: id
      value: 22ac40bd-e160-4c6e-8505-b63913d2482f
      type: path
      description: Activity UUID
  body:
    type: json
    data: |-
      {
        "status": "IN_PROGRESS"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

