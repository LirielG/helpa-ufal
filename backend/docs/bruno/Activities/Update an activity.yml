info:
  name: Update an activity
  type: http
  seq: 4
  tags:
    - Activities

http:
  method: PATCH
  url: "{{baseUrl}}/activities/:id"
  params:
    - name: id
      value: 22ac40bd-e160-4c6e-8505-b63913d2482f
      type: path
      description: Activity UUID
  body:
    type: json
    data: |-
      {
        "title": "Oficina de Introdução à Programação — Turma 2",
        "slots": 50,
        "format": "HYBRID",
        "url": "https://meet.example.com/turma2",
        "address": {
          "addressLine": "Av. Manoel Severino Barbosa, s/n",
          "district": "Bom Sucesso",
          "zipCode": "57309005",
          "city": "Arapiraca",
          "state": "AL"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Activity updated successfully.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "title": "Oficina de Introdução à Programação — Turma 2",
            "slots": 50,
            "format": "HYBRID",
            "url": "https://meet.example.com/turma2",
            "address": {
              "addressLine": "Av. Manoel Severino Barbosa, s/n",
              "district": "Bom Sucesso",
              "zipCode": "57309005",
              "city": "Arapiraca",
              "state": "AL"
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "22ac40bd-e160-4c6e-8505-b63913d2482f",
            "authorId": "c8d83a12-8e1f-4b0d-9a99-980e12345678",
            "title": "Oficina de Introdução à Programação — Turma 2",
            "type": "COURSE",
            "campus": "ARAPIRACA",
            "startDate": "2026-05-01T09:00:00.000Z",
            "endDate": "2026-05-10T17:00:00.000Z",
            "slots": 50,
            "availableSlots": 45,
            "status": "OPEN",
            "createdAt": "2026-04-01T10:00:00.000Z",
            "updatedAt": "2026-04-02T11:00:00.000Z",
            "details": {
              "description": "Curso introdutório de lógica de programação e Python.",
              "area": "Tecnologia",
              "format": "HYBRID",
              "url": "https://meet.example.com/turma2",
              "workloadHours": 20,
              "address": {
                "id": "e9a11223-4567-89ab-cdef-0123456789ab",
                "addressLine": "Av. Manoel Severino Barbosa, s/n",
                "district": "Bom Sucesso",
                "zipCode": "57309005",
                "city": "Arapiraca",
                "state": "AL"
              }
            }
          }
  - name: 400 Response
    description: Validation error or empty body.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "slots": -5
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "message": "Validation error.",
            "errors": [
              {
                "field": "slots",
                "message": "slots must be a positive integer."
              }
            ]
          }
  - name: 401 Response
    description: Unauthenticated.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "title": "Nova oficina"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 401,
            "message": "Unauthenticated."
          }
  - name: 403 Response
    description: Forbidden. Requester is not the author or a manager.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "title": "Nova oficina"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 403,
            "message": "You do not have permission to update this activity."
          }
  - name: 404 Response
    description: Activity not found or deleted.
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "title": "Nova oficina"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 404,
            "message": "Activity not found."
          }
  - name: 409 Response
    description: Activity cannot be updated (status COMPLETED or CANCELLED).
    request:
      url: "{{baseUrl}}/activities/:id"
      method: PATCH
      params:
        - name: id
          value: "22ac40bd-e160-4c6e-8505-b63913d2482f"
          type: path
          description: Activity UUID
      body:
        type: json
        data: |-
          {
            "title": "Nova oficina"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "message": "Activity cannot be updated because it is already COMPLETED."
          }

docs: |-
  Partially updates an activity. Requires authentication (`requireAuth`: author or manager). 
  Activities with status `COMPLETED` or `CANCELLED`, or that have been soft-deleted, cannot be updated. At least one field must be provided.
  For general error format and pagination rules, see [api-conventions.md](../api-conventions.md).