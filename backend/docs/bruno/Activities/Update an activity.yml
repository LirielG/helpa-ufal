info:
  name: Update an activity
  type: http
  seq: 4
  tags:
    - Activities

http:
  method: PATCH
  url: "{{baseUrl}}/activities/:id"
  params:
    - name: id
      value: 22ac40bd-e160-4c6e-8505-b63913d2482f
      type: path
      description: Activity UUID
  body:
    type: json
    data: |-
      {
        "title": "Oficina de Introdução à Programação — Turma 2",
        "slots": 50,
        "format": "HYBRID",
        "url": "https://meet.example.com/turma2",
        "address": {
          "addressLine": "Av. Manoel Severino Barbosa, s/n",
          "district": "Bom Sucesso",
          "zipCode": "57309005",
          "city": "Arapiraca",
          "state": "AL"
        }
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
