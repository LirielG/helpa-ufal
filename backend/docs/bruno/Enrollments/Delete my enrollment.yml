info:
  name: Delete my enrollment
  type: http
  seq: 9
  tags:
    - Enroll

http:
  method: DELETE
  url: "{{baseUrl}}/activities/:activityId/enrollments/me"
  params:
    - name: activityId
      value: f26559ac-d672-4252-a9a4-d6fe6583d8ec
      type: path
      description: Activity UUID

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 - Successful
    description: Enrollment canceled successfully. No content returned. The slot is immediately reflected in availableSlots.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 - Invalid id
    description: The activityId in the path must be a UUID v4.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: "not-a-uuid"
          type: path
          description: Activity UUID
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Validation error.",
            "errors": [
              {
                "field": "activityId",
                "code": "INVALID_UUID",
                "message": "activityId must be a valid UUID."
              }
            ]
          }
  - name: 401 - Unauthenticated
    description: No session cookie was sent.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "UNAUTHENTICATED",
            "status": 401,
            "message": "No token provided."
          }
  - name: 401 - Unauthenticated (Invalid token)
    description: The session cookie is invalid or expired.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: "f26559ac-d672-4252-a9a4-d6fe6583d8ec"
          type: path
          description: Activity UUID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "UNAUTHENTICATED",
            "status": 401,
            "message": "Token malformatted, expired or invalid."
          }
  - name: 401 - Invalid session
    description: The token identifies a removed user or has been revoked.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "SESSION_INVALID",
            "status": 401,
            "message": "Session is no longer valid."
          }
  - name: 404 - Enrollment not found
    description: No active enrollment for the authenticated user in this activity. Also returned when the enrollment was already canceled or belongs to another user — without revealing other users' enrollments.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: "f26559ac-d672-4252-a9a4-d6fe6583d8ec"
          type: path
          description: Activity UUID
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "ENROLLMENT_NOT_FOUND",
            "status": 404,
            "message": "Enrollment not found."
          }
  - name: 404 - Activity not found
    description: Activity not found or soft-deleted.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: "00000000-0000-4000-8000-000000000000"
          type: path
          description: Activity UUID
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "ACTIVITY_NOT_FOUND",
            "status": 404,
            "message": "Activity not found."
          }
  - name: 409 - Not open
    description: Cancellation is only allowed while the activity is OPEN. IN_PROGRESS, COMPLETED and CANCELLED activities return 409.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "CONFLICT",
            "status": 409,
            "message": "Activity is not open for cancellation."
          }
  - name: 500 - Internal error
    description: Internal server error.
    request:
      url: "{{baseUrl}}/activities/:activityId/enrollments/me"
      method: DELETE
      params:
        - name: activityId
          value: ""
          type: path
          description: Activity UUID
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "INTERNAL_ERROR",
            "status": 500,
            "message": "Internal server error."
          }

docs: |-
  Cancels the authenticated user's enrollment in the activity.

  **Authentication:** `requireAuth()`. Use `Auth/Login` to populate the cookie jar with the httpOnly `token` cookie. Missing, invalid or expired cookies return 401 `UNAUTHENTICATED`; removed users and revoked sessions return 401 `SESSION_INVALID`.

  **Route:** `DELETE /activities/:activityId/enrollments/me`. No request body. The session selects the user; params, query and body cannot select another user.

  | Query parameter | Accepted values | Default |
  | --- | --- | --- |
  | None | — | — |

  - Validation order: authentication (401) → id format (400) → activity existence (404) → activity status (409) → active enrollment (404).
  - Only OPEN activities accept cancellation. IN_PROGRESS, COMPLETED and CANCELLED activities return 409 `CONFLICT`, preserving homologated attendance and hours on completed activities.
  - Success returns 204 with an empty body. APPROVED and PENDING enrollments become CANCELLED in the same record, preserving participation history.
  - The lookup is scoped to the session user and activity. A missing, already cancelled or another user's enrollment returns 404 `ENROLLMENT_NOT_FOUND`.
  - An APPROVED enrollment immediately releases its slot. Two concurrent cancellations yield one 204 and one 404.
  - Re-enrollment uses PUT on this same path and reactivates the same record if a slot remains.
  - The former DELETE enrollment route has been removed. Backend and frontend must be deployed together.

  The `activityId` path parameter must be a UUID v4. `validateParams` runs after authentication, before existence and ownership checks. A malformed or non-v4 id returns 400 with `INVALID_UUID` in `errors[]`; a valid id with no resource returns 404. Path, query and body format errors validated by the route are collected in one `errors[]`.

  Error format follows [api-conventions.md](../../api-conventions.md).
