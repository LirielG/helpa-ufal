info:
  name: Verify password reset code
  type: http
  seq: 5
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password/verify"
  body:
    type: json
    data: |-
      {
        "email": "maria@ufal.br",
        "code": "7KQ4-MX9T"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 - Code is valid
    description: The code is the pending one of the account with this e-mail and has not expired. It is not consumed.
    request:
      url: "{{baseUrl}}/auth/forgot-password/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "7KQ4-MX9T"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 - Validation error
    description: The code does not normalize to 8 Crockford Base32 characters. A missing or malformed e-mail gives the same 400 with `field` "email".
    request:
      url: "{{baseUrl}}/auth/forgot-password/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "ABC-DEF"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Validation error.",
            "errors": [
              {
                "field": "code",
                "code": "VALIDATION_ERROR",
                "message": "Code must have 8 Crockford Base32 characters."
              }
            ]
          }
  - name: 422 - Invalid reset code
    description: The e-mail has no account, the account has no pending code, or the code is wrong, expired, used or blocked after 5 wrong attempts. Every case answers the same body.
    request:
      url: "{{baseUrl}}/auth/forgot-password/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "ZZZZ-ZZZZ"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 422,
            "code": "INVALID_RESET_CODE",
            "message": "The reset code is invalid, expired or already used.",
            "errors": [
              {
                "field": "code",
                "code": "INVALID_RESET_CODE",
                "message": "The reset code is invalid, expired or already used."
              }
            ]
          }
  - name: 429 Too many requests
    description: 10 requests per IP every 15 minutes. The route-specific quota is independent; general client and instance quotas also apply.
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
        - name: Retry-After
          value: "900"
      body:
        type: json
        data: |-
          {
            "status": 429,
            "code": "TOO_MANY_REQUESTS",
            "message": "Too many requests. Please try again later."
          }
  - name: 500 - Internal error
    description: Internal server error.
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "code": "INTERNAL_ERROR",
            "message": "Internal server error."
          }

docs: |-
  Checks a password reset code before asking for the new password.

  **Authentication:** public.

  - The code is normalized first: separators (spaces, `-` and the Unicode dashes) are dropped, letters are uppercased, `O` reads as `0` and `I`/`L` as `1`. So `7kq4-mx9t`, `7KQ4MX9T` and `7KQ4–MX9T` are the same code.
  - The code is checked only against the pending code of the account with this `email`; the e-mail goes through the same `trim` and lowercasing as in `POST /auth/forgot-password`. The response body never tells whether the e-mail has an account.
  - Each code accepts at most 5 wrong attempts, summing this route and `POST /auth/reset-password`. The 5th deletes the code, and only a new `POST /auth/forgot-password` issues another one, with the count back at zero.
  - Checking does not consume the code: it is used up only by `POST /auth/reset-password`.

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
