info:
  name: Request password reset
  type: http
  seq: 4
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "maria@email.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 - Request accepted
    description: Always the same empty 204, whether or not the e-mail has an account. When it has one, a code is e-mailed.
    request:
      url: "{{baseUrl}}/auth/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@email.com"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 - Validation error
    description: The e-mail is missing or malformed.
    request:
      url: "{{baseUrl}}/auth/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "not-an-email"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Validation error.",
            "errors": [
              {
                "field": "email",
                "code": "VALIDATION_ERROR",
                "message": "Invalid email address"
              }
            ]
          }
  - name: 429 Too many requests
    description: 5 requests per IP every 15 minutes, and 3 requests per e-mail address every hour from any IP. Both count addresses with and without an account. General client and instance quotas also apply.
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
        - name: Retry-After
          value: "900"
      body:
        type: json
        data: |-
          {
            "status": 429,
            "code": "TOO_MANY_REQUESTS",
            "message": "Too many requests. Please try again later."
          }
  - name: 500 - Internal error
    description: Internal server error.
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "code": "INTERNAL_ERROR",
            "message": "Internal server error."
          }

docs: |-
  Starts a password reset: e-mails a code to the account with this address.

  **Authentication:** public.

  - The answer is the same 204 for an e-mail with or without an account, so the route does not reveal which addresses are registered. The response does not wait for the e-mail to be delivered.
  - The e-mail is matched after `trim` and lowercasing, like the login.
  - The code has 8 Crockford Base32 characters, shown as `XXXX-XXXX`, and is valid for 30 minutes. The e-mail also carries a link to `{APP_PUBLIC_URL}/reset-password#code=<code>`, with the code in the fragment so it never reaches a server.
  - A new request replaces the pending code: the previous one stops working.
  - Only an HMAC of the code is stored. The code itself can be read only from the e-mail.

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
