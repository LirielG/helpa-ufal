info:
  name: Login with email and password
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "user@email.com",
        "password": "1AaBbCcDd_"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().token;
        bru.setEnvVar("apiKey", token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 User
    description: Logged in successfully.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "",
            "user": {
              "id": "",
              "fullName": "",
              "email": "",
              "userType": "STUDENT",
              "isManager": false,
              "createdAt": "",
              "updatedAt": ""
            }
          }
  - name: 400 Response
    description: Validation error.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "message": "Validation error.",
            "errors": [
              {
                "field": "",
                "message": ""
              }
            ]
          }
  - name: 401 Response
    description: Invalid credentials.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
  - name: 500 Response
    description: Internal server error.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 0,
            "message": ""
          }
