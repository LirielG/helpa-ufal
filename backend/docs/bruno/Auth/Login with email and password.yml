info:
  name: Login with email and password
  type: http
  seq: 1
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "user@email.com",
        "password": "1AaBbCcDd_"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 User
    description: Logged in successfully. The session goes in the `token` cookie.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@email.com",
            "password": "1AaBbCcDd_"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
        - name: Set-Cookie
          value: token=<jwt>; Max-Age=86400; Path=/; Expires=Sun, 18 Oct 2026 15:00:00 GMT; HttpOnly; SameSite=Strict
      body:
        type: json
        data: |-
          {
            "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.<payload>.<signature>",
            "user": {
              "id": "3d117a38-e6cd-4429-ab23-72ac93a790e2",
              "fullName": "Maria Silva",
              "email": "maria@email.com",
              "userType": "STUDENT",
              "isManager": false,
              "createdAt": "2026-10-17T15:06:38.978Z",
              "updatedAt": "2026-10-17T15:06:38.978Z"
            }
          }
  - name: 400 Response
    description: The body fails schema validation.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "not-an-email",
            "password": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "message": "Validation error.",
            "errors": [
              {
                "field": "email",
                "message": "Invalid email address"
              },
              {
                "field": "password",
                "message": "Too small: expected string to have >=1 characters"
              }
            ]
          }
  - name: 401 Response
    description: Unknown email or wrong password. Both answer the same message.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@email.com",
            "password": "wrong-password"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 401,
            "message": "Invalid credentials."
          }
  - name: 500 Response
    description: Internal server error.
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@email.com",
            "password": "1AaBbCcDd_"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "message": "Internal server error."
          }

docs: |-
  Authenticates with email and password and starts the session.

  **Authentication:** public.

  - On success the server writes the httpOnly `token` cookie (`Max-Age` follows `JWT_EXPIRES_IN`). Bruno's cookie jar stores it and sends it on the following requests, so nothing has to be copied by hand.
  - The body still echoes the JWT in `token`. Clients must not rely on it: the cookie is the only supported mechanism.

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
