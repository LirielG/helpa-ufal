info:
  name: Reset password
  type: http
  seq: 6
  tags:
    - Auth

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "maria@ufal.br",
        "code": "7KQ4-MX9T",
        "newPassword": "Nova@Senha1"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 - Password reset
    description: The password was replaced and every previous session revoked. No cookie is written; sign in with the new password.
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "7KQ4-MX9T",
            "newPassword": "Nova@Senha1"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 - Validation error
    description: The new password is outside the policy, or the code does not normalize to 8 Crockford Base32 characters (then the item has `field` "code"), or the e-mail is missing or malformed (`field` "email").
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "7KQ4-MX9T",
            "newPassword": "123"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Validation error.",
            "errors": [
              {
                "field": "newPassword",
                "code": "VALIDATION_ERROR",
                "message": "Password must be at least 8 characters long and include an uppercase letter, a lowercase letter, a number, and a special character."
              }
            ]
          }
  - name: 422 - Invalid reset code
    description: The e-mail has no account, the account has no pending code, or the code is wrong, expired, used (including by a concurrent request) or blocked after 5 wrong attempts. Every case answers the same body, and the password is not changed.
    request:
      url: "{{baseUrl}}/auth/reset-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "maria@ufal.br",
            "code": "ZZZZ-ZZZZ",
            "newPassword": "Nova@Senha1"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 422,
            "code": "INVALID_RESET_CODE",
            "message": "The reset code is invalid, expired or already used.",
            "errors": [
              {
                "field": "code",
                "code": "INVALID_RESET_CODE",
                "message": "The reset code is invalid, expired or already used."
              }
            ]
          }
  - name: 429 Too many requests
    description: 10 requests per IP every 15 minutes. The route-specific quota is independent; general client and instance quotas also apply.
    response:
      status: 429
      statusText: Too Many Requests
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
        - name: Retry-After
          value: "900"
      body:
        type: json
        data: |-
          {
            "status": 429,
            "code": "TOO_MANY_REQUESTS",
            "message": "Too many requests. Please try again later."
          }
  - name: 500 - Internal error
    description: Internal server error.
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "code": "INTERNAL_ERROR",
            "message": "Internal server error."
          }

docs: |-
  Sets a new password with a code from `POST /auth/forgot-password`.

  **Authentication:** public. No cookie is read or written, and no session is created.

  - The code is normalized and checked against the account with this `email` the same way as in `POST /auth/forgot-password/verify`. A wrong code here counts toward the same limit of 5 wrong attempts.
  - On success the code is consumed, the password replaced and `tokenVersion` incremented, so every cookie issued before answers `401 SESSION_INVALID`. A "password changed" notice is e-mailed.
  - A new password equal to the current one is accepted, unlike `PATCH /users/me`: whoever forgot the password cannot know the current one.
  - Two concurrent requests with the same code: exactly one succeeds, the other answers 422.

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
