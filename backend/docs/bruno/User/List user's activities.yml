info:
  name: List user's activities
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/me/activities"
  params:
    - name: filter
      value: enrolled
      type: query
      description: enrolled | completed | managed (required)
    - name: page
      value: "1"
      type: query
      description: Current page
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Items per page
      disabled: true

examples:
  - name: 200 filter=enrolled
    description: Approved enrollment in an activity with status OPEN or IN_PROGRESS.
    response:
      status: 200
      body: |-
        {
          "items": [
