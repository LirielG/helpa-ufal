  - name: 200 filter=managed
    description: Activities created by the user (Activity.authorId = userId), in any status. enrollment is null when the author is not enrolled in their own activity, as here; details is null when the activity has no ActivityDetails.
    response:
      status: 200
      body: |-
        {
          "items": [
            {
              "id": "a1b2c3d4-0000-4000-8000-000000000033",
              "authorId": "7c9e6679-7425-40de-944b-e07fc1f90ae7",
              "title": "Study Group",
              "type": "OTHER",
              "campus": "ARAPIRACA",
              "startDate": "2026-09-05T18:00:00.000Z",
              "endDate": "2026-09-05T20:00:00.000Z",
              "slots": 15,
              "availableSlots": 15,
              "status": "OPEN",
              "details": null,
              "enrollment": null
            }
          ],
          "total": 1,
          "page": 1,
          "limit": 20,
          "totalPages": 1
        }

  - name: 200 Empty list
    description: No activity matches the filter, or page is beyond the last one. Never 404. total is the real total and totalPages is never below 1.
    response:
      status: 200
      body: |-
        { "items": [], "total": 0, "page": 1, "limit": 20, "totalPages": 1 }

  - name: 400 Invalid query
    description: Every invalid or unknown parameter gets its own entry in errors[].
    response:
      status: 400
      body: |-
        {
          "status": 400,
          "message": "Invalid query parameters.",
          "errors": [
            { "field": "filter", "message": "filter must be one of: enrolled, completed, managed." },
            { "field": "page", "message": "page must be a positive integer." },
            { "field": "limit", "message": "limit must be at most 100." },
            { "field": "foo", "code": "UNKNOWN_PARAMETER", "message": "foo is not a supported query parameter." }
          ]
        }

  - name: 401 Missing token
    description: No session cookie was sent.
    response:
      status: 401
      body: |-
        { "status": 401, "message": "No token provided." }

  - name: 401 Invalid or expired token
    description: A credential was sent but failed verification - malformed, wrong signature or past its expiry. One message on purpose, so the response never tells which one it was.
    response:
      status: 401
      body: |-
        { "status": 401, "message": "Token malformatted, expired or invalid." }

  - name: 404 User no longer exists
    description: Valid credential, but the user from the token is gone. Same answer as GET /users/me.
    response:
      status: 404
      body: |-
        { "status": 404, "message": "User not found." }

docs: |-
  # GET /users/me/activities — Enrolled, completed and managed activities

  Lists the activities linked to the authenticated user according to the chosen filter,
  in three groups: `enrolled`, `completed` and `managed`. It backs the "Ações" tab of the
  profile.

  ## Authentication
  - `requireAuth` (`auth({ userTypes: "all" })`), through the httpOnly `token` cookie.
  - The `userId` is extracted exclusively from the token — never from `params`, `query` or
    `body`. There is no way to ask this route for someone else's activities.

  ## Query params
  | Param  | Type | Required | Description |
  |--------|------|----------|-------------|
  | filter | enum | yes      | `enrolled` \| `completed` \| `managed` |
  | page   | int  | no       | Conventional pagination |
  | limit  | int  | no       | Conventional pagination |

  Any other parameter answers 400 `UNKNOWN_PARAMETER`.

  ## Filter matrix (all with `Activity.deletedAt IS NULL`)
  | filter      | Rule |
  |-------------|------|
  | `enrolled`  | `Enrollment.status = APPROVED` for the user AND `Activity.status` in (`OPEN`, `IN_PROGRESS`) |
  | `completed` | `Enrollment.status = APPROVED` AND `Activity.status = COMPLETED` AND `Enrollment.attendanceConfirmed` is `true` or `null` |
  | `managed`   | `Activity.authorId = userId`, in any `Activity.status` (including `CANCELLED` and `COMPLETED`). Moderators (`Enrollment.isModerator`) are not included unless they are the author |

  `Enrollment.attendanceConfirmed` is tri-state (`null` = not homologated yet, `true` =
  present, `false` = absent). Only a registered absence leaves `completed`: someone whose
  attendance nobody homologated yet still took part, and the client tells the two apart
  through `enrollment.attendanceConfirmed`.

  `enrolled` and `completed` are mutually exclusive: `Activity.status` separates them.
  `managed` may overlap with the other two when the author is also enrolled in their own
  activity. The activity then appears in each filter it matches, never duplicated within
  one response.

  ## Item
  The activity exactly as `GET /activities/:activityId` returns it to an anonymous caller
  (with `details`, `null` when the activity has none), plus:

  | Field        | Description |
  |--------------|-------------|
  | `enrollment` | The token owner's enrollment in its canonical form, as `PUT /enrollments/:enrollmentId/attendance` returns it. Always present in `enrolled` and `completed`. In `managed`, the author's own enrollment in whatever status, or `null` when they never enrolled |

  The detail route's `enrollmentStatus` is not repeated: `enrollment.status` carries it.

  ## Business rules
  - The user only sees their own history.
  - `PENDING`, `REJECTED` or `CANCELLED` enrollments never place an activity in
    `enrolled` or `completed`.
  - Soft-deleted activities (`deletedAt != null`) never appear in any filter.
  - Ordering: `startDate` descending, ties broken by `id`, so pagination is deterministic.

  ## Validation order
  1. Authentication (401)
  2. Query params (400 — every invalid param appears in `errors[]`)
  3. The user exists (404)

  ## Errors
  | Status | When |
  |--------|------|
  | 400 | Missing or invalid `filter`; invalid `page` or `limit`; unknown parameter |
  | 401 | Missing credential, invalid signature, malformed or expired token |
  | 404 | The user from the token no longer exists |

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
