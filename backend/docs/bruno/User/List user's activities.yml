          "page": 1,
          "limit": 20,
          "totalPages": 1
        }

  - name: 200 filter=completed
    description: Approved enrollment in a COMPLETED activity, with attendance confirmed (true) or not homologated yet (null). A registered absence (false) does not appear.
    response:
      status: 200
      body: |-
        {
          "items": [
            {
              "id": "a1b2c3d4-0000-4000-8000-000000000032",
