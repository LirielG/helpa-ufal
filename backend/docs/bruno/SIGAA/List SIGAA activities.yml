info:
  name: List SIGAA activities
  type: http
  seq: 1
  tags:
    - SIGAA

http:
  method: GET
  url: "{{baseUrl}}/sigaa-activities"
  params:
    - name: search
      value: ""
      type: query
      description: Partial, case-insensitive search on title.
      disabled: true
    - name: type
      value: ""
      type: query
      description: Exact match on SIGAA type. Use /sigaa-activities/filters for valid values.
      disabled: true
    - name: department
      value: ""
      type: query
      description: Exact match on department acronym. Use /sigaa-activities/filters for valid values.
      disabled: true
    - name: page
      value: "1"
      type: query
      description: "Page number"
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: "Items per page"
      disabled: true
    - name: orderBy
      value: lastSeenAt
      type: query
      description: "Sort field (default: lastSeenAt)."
      disabled: true
    - name: orderBy
      value: title
      type: query
      description: "Sort field (default: lastSeenAt)."
      disabled: true
    - name: order
      value: desc
      type: query
      description: "Sort direction (default: desc)."
      disabled: true
    - name: order
      value: asc
      type: query
      description: "Sort direction (default: desc)."
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 - Paginated list
    description: Paginated SIGAA activities. Uses the standard paginated envelope (items/total/page/limit/totalPages).
    request:
      url: "{{baseUrl}}/sigaa-activities"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
          description: "Page number"
        - name: limit
          value: "20"
          type: query
          description: "Items per page"
        - name: search
          value: ""
          type: query
          description: Partial, case-insensitive search on title.
          disabled: true
        - name: type
          value: ""
          type: query
          description: Exact match on SIGAA type.
          disabled: true
        - name: department
          value: ""
          type: query
          description: Exact match on department acronym.
          disabled: true
        - name: orderBy
          value: lastSeenAt
          type: query
          description: "Sort field (default: lastSeenAt)."
        - name: order
          value: desc
          type: query
          description: "Sort direction (default: desc)."
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "5b8f0d2a-6c1e-4f3b-9a7d-2e4c6f8a0b1c",
                "sigaaId": "48213",
                "title": "CURSO DE EXTENSÃO EM ROBÓTICA EDUCACIONAL",
                "type": "CURSO",
                "normalizedType": "COURSE",
                "department": "ICAT",
                "lastSeenAt": "2026-10-17T12:00:00.000Z"
              }
            ],
            "total": 1,
            "page": 1,
            "limit": 20,
            "totalPages": 1
          }
  - name: 400 - Validation error
    description: Invalid orderBy or order.
    request:
      url: "{{baseUrl}}/sigaa-activities"
      method: GET
      params:
        - name: orderBy
          value: foo
          type: query
          description: Invalid sort field.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "message": "Validation error.",
            "errors": [
              {
                "field": "orderBy",
                "message": "orderBy must be one of: title, lastSeenAt"
              }
            ]
          }
  - name: 400 - Invalid pagination
    description: page or limit is not a positive integer, or limit is above the ceiling. One item per parameter.
    request:
      url: "{{baseUrl}}/sigaa-activities"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
          description: Below the first page.
        - name: limit
          value: "101"
          type: query
          description: Above the ceiling.
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Invalid query parameters.",
            "errors": [
              { "field": "page", "code": "VALIDATION_ERROR", "message": "page must be a positive integer." },
              { "field": "limit", "code": "VALIDATION_ERROR", "message": "limit must be at most 100." }
            ]
          }
  - name: 500 - Internal error
    description: Internal server error.
    request:
      url: "{{baseUrl}}/sigaa-activities"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "message": "Internal server error."
          }

docs: |-
  Returns a paginated list of the extension activities scraped from the SIGAA.

  **Authentication:** public.

  ## Query params
  | Param | Match | Default |
  |-------|-------|---------|
  | `search` | Partial, case-insensitive, on `title` | — |
  | `type` | Exact, on the raw SIGAA type (values from `GET /sigaa-activities/filters`) | — |
  | `department` | Exact, on the department acronym (values from `GET /sigaa-activities/filters`) | — |
  | `page` / `limit` | Conventional pagination | conventional |
  | `orderBy` | `title` or `lastSeenAt` | `lastSeenAt` |
  | `order` | `asc` or `desc` | `desc` |

  - `department` is nullable on each item. `type` is the raw SIGAA label, as scraped; `normalizedType` is the mapped value (EXTENSION, COURSE, EVENT, LECTURE, OTHER).
  - `search`, `type` and `department` combine: `search` is a partial, case-insensitive match on the title, while `type` and `department` are exact matches. Only active activities are listed.
  - Invalid `page`, `limit`, `orderBy` or `order` values answer 400.
  - Unknown query params and filter values that match nothing are accepted and return an empty `items` list.
  - The request triggers an on-demand sync with the SIGAA (12h cache), so the first call after the cache expires can take much longer than the following ones. Use GET /sigaa-activities/filters when you only need the filter values, since that route never syncs.

  Pagination, envelope and error format follow [api-conventions.md](../../api-conventions.md).
