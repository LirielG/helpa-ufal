info:
  name: Create moderation decision
  type: http
  seq: 2
  tags:
    - Reports

http:
  method: POST
  url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
  params:
    - name: activityId
      value: 22ac40bd-e160-4c6e-8505-b63913d2482f
      type: path
      description: Activity UUID
  body:
    type: json
    data: |-
      {
        "verdict": "UPHELD",
        "justification": "A ação viola as diretrizes institucionais da plataforma."
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 - Created
    description: Decision registered and linked to all open reports of the activity. Returns the decision in the format of an item of decisions[] in GET /reported-activities.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "UPHELD",
            "justification": "A ação viola as diretrizes institucionais da plataforma."
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "c3d4e5f6-0000-4000-8000-000000000010",
            "verdict": "UPHELD",
            "justification": "A ação viola as diretrizes institucionais da plataforma.",
            "createdAt": "2026-06-10T12:00:00.000Z",
            "decidedBy": {
              "id": "a1b2c3d4-0000-4000-8000-000000000001",
              "fullName": "Gestor UFAL"
            },
            "reports": [
              {
                "id": "b2c3d4e5-0000-4000-8000-000000000007",
                "category": "MISINFORMATION",
                "description": "The address provided is incorrect.",
                "createdAt": "2026-06-05T19:44:20.000Z",
                "reporter": {
                  "id": "a1b2c3d4-0000-4000-8000-000000000042",
                  "fullName": "Maria Clara Santos"
                }
              }
            ]
          }

  - name: 400 - Invalid path or body
    description: Invalid activityId, verdict or justification (empty, whitespace-only or over 500 chars after trim). Path and body errors are returned in a single errors[].
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: not-a-uuid
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "UPHELD",
            "justification": "   "
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Validation error.",
            "errors": [
              {
                "field": "activityId",
                "code": "INVALID_UUID",
                "message": "activityId must be a valid UUID."
              },
              {
                "field": "justification",
                "code": "VALIDATION_ERROR",
                "message": "justification must contain between 1 and 500 characters."
              }
            ]
          }

  - name: 401 - Unauthenticated
    description: Session missing, invalid or expired. Checked before role, format and existence.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 401,
            "code": "UNAUTHENTICATED",
            "message": "No token provided."
          }

  - name: 403 - Not a manager
    description: Authenticated user does not hold the manager role.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 403,
            "code": "FORBIDDEN",
            "message": "User is not a manager."
          }

  - name: 403 - Manager is the activity author
    description: A manager cannot decide on reports against their own activity.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 403,
            "code": "FORBIDDEN",
            "message": "Activity authors cannot moderate their own activity."
          }

  - name: 404 - Activity not found
    description: Activity does not exist or was soft-deleted by its author.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: "00000000-0000-4000-8000-000000000000"
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 404,
            "code": "ACTIVITY_NOT_FOUND",
            "message": "Activity not found."
          }

  - name: 409 - No open reports
    description: The activity has no open reports (also returned on double-click or concurrent decision).
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "NO_OPEN_REPORTS",
            "message": "Activity has no open reports."
          }

  - name: 409 - Activity completed
    description: UPHELD is not allowed for COMPLETED activities (only REJECTED is accepted).
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "UPHELD",
            "justification": "Tentativa de remoção de ação concluída."
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 409,
            "code": "ACTIVITY_COMPLETED",
            "message": "Completed activities cannot be removed by moderation."
          }

  - name: 500 - Internal error
    description: Internal server error.
    request:
      url: "{{baseUrl}}/activities/:activityId/moderation-decisions"
      method: POST
      params:
        - name: activityId
          value: 22ac40bd-e160-4c6e-8505-b63913d2482f
          type: path
      body:
        type: json
        data: |-
          {
            "verdict": "REJECTED",
            "justification": "Sem indícios."
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "code": "INTERNAL_ERROR",
            "message": "Internal server error."
          }

docs: |-
  Records a moderation decision against an activity, closing all of its open reports atomically. General rules (status codes, error body, validation order) are in [api-conventions.md](../../api-conventions.md).

  **Authentication:** manager only (`requireAuth({ manager: true })`).

  **Request body**

  | Field | Type | Rules |
  |---|---|---|
  | `verdict` | `"UPHELD" \| "REJECTED"` | Required |
  | `justification` | `string` | Required, trimmed, 1 to 500 characters |

  **Route-specific behavior**

  - Validation order: `401` → `403` (manager role) → `400` (`activityId` and body combined) → `404 ACTIVITY_NOT_FOUND` → `403 FORBIDDEN` (manager is the activity author) → `409 NO_OPEN_REPORTS` → `409 ACTIVITY_COMPLETED`.
  - Runs under a row lock on `Activity` (`SELECT ... FOR UPDATE`), so concurrent requests serialize cleanly and double-clicks return `409 NO_OPEN_REPORTS` without creating orphan decisions.
  - `UPHELD` (allowed on `OPEN`, `IN_PROGRESS` and `CANCELLED` activities): sets `Activity.removedByModerationAt` (if not already set) and transitions `PENDING`/`APPROVED` enrollments without a certificate to `CANCELLED`. `Activity.status` and existing certificates are never altered.
  - `REJECTED`: closes all open reports without modifying the activity or its enrollments.
