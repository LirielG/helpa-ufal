info:
  name: List reported activities
  type: http
  seq: 1
  tags:
    - Reports

http:
  method: GET
  url: "{{baseUrl}}/reported-activities"
  params:
    - name: status
      value: open
      type: query
      description: open | decided (default open)
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Page number
      disabled: true
    - name: limit
      value: "20"
      type: query
      description: Items per page
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 - Open queue
    description: Activities with at least one open report, ordered by most recent open report. Past decisions remain in decisions[].
    request:
      url: "{{baseUrl}}/reported-activities"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "activity": {
                  "id": "22ac40bd-e160-4c6e-8505-b63913d2482f",
                  "title": "Oficina de Introdução à Programação",
                  "status": "OPEN",
                  "authorId": "a1b2c3d4-0000-4000-8000-000000000099",
                  "removedByModerationAt": null
                },
                "openReports": [
                  {
                    "id": "b2c3d4e5-0000-4000-8000-000000000007",
                    "category": "MISINFORMATION",
                    "description": "The address provided is incorrect.",
                    "createdAt": "2026-06-05T19:44:20.000Z",
                    "reporter": {
                      "id": "a1b2c3d4-0000-4000-8000-000000000042",
                      "fullName": "Maria Clara Santos"
                    }
                  }
                ],
                "decisions": [
                  {
                    "id": "c3d4e5f6-0000-4000-8000-000000000010",
                    "verdict": "REJECTED",
                    "justification": "Informações conferidas com a coordenação.",
                    "createdAt": "2026-06-01T14:00:00.000Z",
                    "decidedBy": {
                      "id": "a1b2c3d4-0000-4000-8000-000000000001",
                      "fullName": "Gestor UFAL"
                    },
                    "reports": [
                      {
                        "id": "b2c3d4e5-0000-4000-8000-000000000006",
                        "category": "SPAM",
                        "description": null,
                        "createdAt": "2026-05-30T10:12:00.000Z",
                        "reporter": null
                      }
                    ]
                  }
                ]
              }
            ],
            "total": 1,
            "page": 1,
            "limit": 20,
            "totalPages": 1
          }

  - name: 200 - Empty list
    description: Nothing matches the filter, or page is beyond the last one. Never 404.
    request:
      url: "{{baseUrl}}/reported-activities?status=decided"
      method: GET
      params:
        - name: status
          value: decided
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [],
            "total": 0,
            "page": 1,
            "limit": 20,
            "totalPages": 1
          }

  - name: 400 - Invalid query
    description: A parameter has an invalid value (empty included) or is not supported by the route. Every offending parameter gets its own item.
    request:
      url: "{{baseUrl}}/reported-activities?status=OPEN&resolved=false"
      method: GET
      params:
        - name: status
          value: OPEN
          type: query
        - name: resolved
          value: "false"
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 400,
            "code": "VALIDATION_ERROR",
            "message": "Invalid query parameters.",
            "errors": [
              {
                "field": "status",
                "code": "VALIDATION_ERROR",
                "message": "status must be one of: open, decided."
              },
              {
                "field": "resolved",
                "code": "UNKNOWN_PARAMETER",
                "message": "resolved is not a supported query parameter."
              }
            ]
          }

  - name: 401 - Unauthenticated
    description: Session missing, invalid or expired.
    request:
      url: "{{baseUrl}}/reported-activities"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 401,
            "code": "UNAUTHENTICATED",
            "message": "No token provided."
          }

  - name: 401 - Session invalid
    description: The session user was removed or the session was revoked.
    request:
      url: "{{baseUrl}}/reported-activities"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 401,
            "code": "SESSION_INVALID",
            "message": "Session is no longer valid."
          }

  - name: 403 - Not a manager
    description: The user is authenticated but is not a manager. Checked before query validation.
    request:
      url: "{{baseUrl}}/reported-activities"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 403,
            "code": "FORBIDDEN",
            "message": "User is not a manager."
          }

  - name: 500 - Internal error
    description: Internal server error.
    request:
      url: "{{baseUrl}}/reported-activities"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": 500,
            "code": "INTERNAL_ERROR",
            "message": "Internal server error."
          }

docs: |-
  Moderation queue grouped by activity. General rules (pagination, envelope, error body) are in [api-conventions.md](../../api-conventions.md).

  **Authentication:** manager only (`requireAuth({ manager: true })`).

  **Query parameters**

  | Parameter | Values | Default |
  |---|---|---|
  | `status` | `open` (activities with open reports) or `decided` (activities with no open reports and at least one decision) | `open` |
  | `page` / `limit` | conventional pagination | conventional |

  Any other parameter answers 400 `UNKNOWN_PARAMETER`.

  **Route-specific behavior**

  - `open`: activities not soft-deleted by their author that have at least one open report (`decisionId IS NULL`), ordered by most recent open report descending, tie-broken by activity `id`. An activity with an open report appears only in `open`, even if it has previous decisions.
  - `decided`: activities with no open reports and at least one moderation decision, ordered by most recent decision descending, tie-broken by activity `id`. Historical decisions remain listed even if the author later deleted the activity.
  - `openReports[]`, `decisions[]`, and `decisions[].reports[]` are ordered newest first (`createdAt` descending, tie-broken by `id`). `decisions[]` has no internal pagination.
  - `reporter` and `decidedBy` are `null` when the user account was removed.
